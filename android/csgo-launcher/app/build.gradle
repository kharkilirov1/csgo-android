plugins {
    id "com.android.application"
}

android {
    namespace "com.valvesoftware.source"
    compileSdk 35

    defaultConfig {
        applicationId "com.kharki.csgo"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../AndroidManifest.xml"
            java.srcDirs = ["../src"]
            res.srcDirs = ["../res"]
            assets.srcDirs = ["../assets"]
            jniLibs.srcDirs = ["../jniLibs"]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
