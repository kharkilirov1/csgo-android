plugins {
    id "com.android.application"
}

def buildVersionCode = providers.environmentVariable("CSGO_VERSION_CODE").orElse("1").get().toInteger()
def buildVersionName = providers.environmentVariable("CSGO_VERSION_NAME").orElse("0.1.0-local").get()

android {
    namespace "com.valvesoftware.source"
    compileSdk 35

    defaultConfig {
        applicationId "com.kharki.csgo"
        minSdk 28
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../AndroidManifest.xml"
            java.srcDirs = ["../src"]
            res.srcDirs = ["../res"]
            assets.srcDirs = ["../assets"]
            jniLibs.srcDirs = ["../jniLibs"]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
