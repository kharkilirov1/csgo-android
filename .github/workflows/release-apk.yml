name: Build APK (arm64)

# Builds and validates an arm64 debug APK. It never creates tags or releases.
# extras_dir.vpk is only the bootstrap payload; full CS:GO game data is absent.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run source regression tests
        run: |
          python3 android/csgo-launcher/tests/check_launcher_integration.py
          python3 unittests/core_runtime_source_checks.py

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsdl2-dev libfreetype6-dev libopenal-dev libcurl4-openssl-dev \
            libedit-dev libjpeg-dev libpng-dev libbz2-dev unzip

      - name: Fetch NDK r20b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip -O ndk.zip
          . scripts/android-aarch64-common.sh
          printf '%s  %s\n' "$ANDROID_NDK_R20B_SHA256" ndk.zip | sha256sum -c -
          unzip -q ndk.zip
          rm ndk.zip

      - name: Build engine for arm64
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r20b
          NDK_HOME: ${{ github.workspace }}/android-ndk-r20b
        run: |
          scripts/build-android-aarch64.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Package APK
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r20b
          NDK_HOME: ${{ github.workspace }}/android-ndk-r20b
          CSGO_VERSION_CODE: ${{ github.run_number }}
          CSGO_VERSION_NAME: 0.1.0-ci.${{ github.run_number }}
        run: |
          scripts/build-apk-aarch64.sh

      - name: Record checksum
        run: sha256sum android/csgo-launcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Store debug APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgo-android-${{ github.sha }}-arm64-debug
          path: android/csgo-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
